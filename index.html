<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صالون محمد عدنان - الحجز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #d4af37;
            --gold-hover: #f3cf55;
            --card-bg: rgba(30, 34, 45, 0.7);
            --text-muted: #a0aec0;
            --border-color: rgba(214, 175, 55, 0.15);
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f1116 0%, #171a21 100%);
            color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; padding: 30px 20px;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header .logo-icon { font-size: 45px; color: var(--gold); margin-bottom: 10px; }
        .header h1 { font-size: 28px; font-weight: 900; }
        .container { width: 100%; max-width: 480px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 24px;
            border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-group input {
            width: 100%; padding: 16px 45px 16px 15px; background: #12141a;
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
            color: white; font-size: 16px; outline: none; text-align: center; font-family: 'Cairo', sans-serif;
        }
        .input-group input:focus { border-color: var(--gold); }
        .main-btn {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: var(--gold); color: #0b0c10; font-size: 18px; font-weight: 800;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
            font-family: 'Cairo', sans-serif; transition: all 0.3s ease;
        }
        .main-btn:hover { background: var(--gold-hover); transform: translateY(-2px); }
        .main-btn:disabled { background: #4a4a4a; color: #8a8a8a; cursor: not-allowed; transform: none; }

        #queueDisplay { display: none; text-align: center; }
        .status-pill {
            background: rgba(214,175,55,0.1); color: var(--gold); padding: 8px 20px;
            border-radius: 50px; display: inline-flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 600; margin-bottom: 25px;
        }
        .pulse-dot { width: 8px; height: 8px; background: var(--gold); border-radius: 50%; animation: pulse 1.5s infinite; }
        .counter-box {
            background: #12141a; padding: 25px; border-radius: 20px;
            margin: 20px 0; border: 1px solid rgba(255,255,255,0.03);
        }
        .number-big { font-size: 70px; font-weight: 900; color: var(--gold); line-height: 1; margin-top: 10px; }

        .done-btn {
            margin-top: 22px; width: 100%; padding: 20px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, #2ed573, #1db954);
            color: #fff; font-size: 22px; font-weight: 900;
            cursor: pointer; display: none; justify-content: center; align-items: center; gap: 12px;
            font-family: 'Cairo', sans-serif; transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(46,213,115,0.45);
            animation: bounceIn 0.6s ease;
        }
        .done-btn:active { transform: scale(0.97); }

        #finishScreen { display: none; text-align: center; padding: 15px 0; }
        .finish-emoji { font-size: 90px; margin-bottom: 15px; animation: bounceIn 0.8s ease; display: block; }
        .finish-title { font-size: 28px; font-weight: 900; color: var(--gold); margin-bottom: 12px; }
        .finish-sub { font-size: 15px; color: var(--text-muted); line-height: 2; }

        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 999;
            justify-content: center; align-items: flex-end; padding: 20px;
        }
        .overlay.show { display: flex; }
        .popup {
            background: #1e2230; border-radius: 28px 28px 20px 20px; padding: 30px;
            width: 100%; max-width: 440px; text-align: center;
            border: 1px solid rgba(255,255,255,0.08); animation: slideUp 0.4s ease;
        }
        .popup .q-emoji { font-size: 70px; display: block; margin-bottom: 15px; }
        .popup h3 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
        .popup p { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.7; }
        .popup-btns { display: flex; gap: 12px; }
        .popup-btns button { flex: 1; padding: 16px; border-radius: 14px; border: none; font-size: 18px; font-weight: 800; cursor: pointer; font-family: 'Cairo', sans-serif; }
        .btn-yes { background: linear-gradient(135deg, #2ed573, #1db954); color: #fff; box-shadow: 0 5px 20px rgba(46,213,115,0.4); }
        .btn-no { background: rgba(255,255,255,0.07); color: #fff; }

        @keyframes pulse { 0%,100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animated { animation: fadeIn 0.6s ease; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-icon"><i class="fas fa-scissors"></i></div>
        <h1>صالون محمد عدنان</h1>
    </div>

    <div class="container">
        <!-- فورم الحجز -->
        <div class="card animated" id="bookingForm">
            <h3>احجز للحلاقة الآن</h3>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="name" placeholder="أدخل اسمك الكريم" autocomplete="off">
            </div>
            <button class="main-btn" id="submitBtn" onclick="book()">
                <i class="fas fa-check"></i> تأكيد الحجز
            </button>
        </div>

        <!-- شاشة الانتظار -->
        <div class="card animated" id="queueDisplay">
            <h3>مرحباً، <span id="displayName" style="color: var(--gold);"></span></h3>
            <div class="status-pill">
                <div class="pulse-dot"></div>
                <span id="statusText">أنت في قائمة الانتظار</span>
            </div>
            <div class="counter-box">
                <span style="color: var(--text-muted); font-size: 14px;">عدد المنتظرين أمامك</span>
                <div class="number-big" id="queueNumber">--</div>
            </div>
            <p id="msg" style="color: var(--text-muted); font-size: 14px; line-height: 1.8;"></p>
            <button class="done-btn" id="doneBtn" onclick="showConfirm()">
                <span style="font-size:26px;">✅</span> انتهيت من الحلاقة
            </button>
        </div>

        <!-- شاشة النهاية -->
        <div class="card animated" id="finishScreen">
            <span class="finish-emoji">💈</span>
            <div class="finish-title">نعيماً يا عيوني! 🎉</div>
            <div class="finish-sub">شكراً لزيارتك صالون محمد عدنان<br>نتشرف بخدمتك دائماً ✂️</div>
        </div>
    </div>

    <!-- Popup تأكيد -->
    <div class="overlay" id="confirmOverlay">
        <div class="popup">
            <span class="q-emoji">✂️</span>
            <h3>انتهيت من الحلاقة؟</h3>
            <p>اضغط نعم إذا خلصت<br>وراح نحذف دورك من القائمة</p>
            <div class="popup-btns">
                <button class="btn-yes" onclick="confirmDone()">✅ نعم، خلصت</button>
                <button class="btn-no" onclick="closeConfirm()">❌ لا، بعد</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hoskjuzkxrmzuarobofp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhvc2tqdXpreHJtenVhcm9ib2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTI0OTQsImV4cCI6MjA5NjMyODQ5NH0.djwG-Oybxf3rKyxvLlrClAMkdjyMw-_vTMyGJmOO-30';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myId = null;
        let updateInterval = null;
        let alreadyNotified = false; // ✅ منع تكرار الصوت

        // ✅ صوت تنبيه للزبون - نغمة جرس احترافية
        function playTurnSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                // نغمة جرس - ثلاث نبضات صاعدة
                const notes = [523, 659, 784]; // Do - Mi - Sol
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    const start = ctx.currentTime + i * 0.3;
                    gain.gain.setValueAtTime(0, start);
                    gain.gain.linearRampToValueAtTime(0.5, start + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
                    osc.start(start);
                    osc.stop(start + 0.6);
                });
            } catch(e) {}
        }

        async function book() {
            const nameInput = document.getElementById('name');
            const submitBtn = document.getElementById('submitBtn');
            const name = nameInput.value.trim();

            if (!name) {
                nameInput.style.borderColor = '#ff4d4d';
                nameInput.placeholder = 'يرجى كتابة اسمك أولاً!';
                return;
            }

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحجز...';
            submitBtn.disabled = true;

            try {
                const { data, error } = await db
                    .from('appointments')
                    .insert([{ customer_name: name, status: 'pending' }])
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    myId = data[0].id;

                    // ✅ إخفاء الفورم وإظهار شاشة الانتظار - بدون reload
                    document.getElementById('bookingForm').style.display = 'none';
                    document.getElementById('queueDisplay').style.display = 'block';
                    document.getElementById('displayName').innerText = name;

                    updateUI();
                    updateInterval = setInterval(updateUI, 4000);
                }
            } catch (err) {
                alert('حدث خطأ: ' + err.message);
                submitBtn.innerHTML = '<i class="fas fa-check"></i> تأكيد الحجز';
                submitBtn.disabled = false;
            }
        }

        async function updateUI() {
            if (!myId) return;
            try {
                const { data: appt, error } = await db
                    .from('appointments').select('*').eq('id', myId).single();

                if (error) return;

                if (appt.status === 'approved') {
                    clearInterval(updateInterval);

                    // ✅ صوت مرة وحدة بس
                    if (!alreadyNotified) {
                        alreadyNotified = true;
                        playTurnSound();
                    }

                    const pill = document.querySelector('.status-pill');
                    pill.style.background = 'rgba(46,213,115,0.1)';
                    pill.style.color = '#2ed573';
                    document.querySelector('.pulse-dot').style.background = '#2ed573';
                    document.getElementById('statusText').innerText = '✂️ حان دورك الآن!';
                    document.getElementById('queueNumber').innerText = '✂️';
                    document.getElementById('queueNumber').style.color = '#2ed573';
                    document.getElementById('msg').innerHTML = 'تفضل للكرسي الآن 💈<br>نعيماً مقدماً!';
                    document.getElementById('doneBtn').style.display = 'flex';

                } else if (appt.status === 'pending') {
                    const { count } = await db
                        .from('appointments')
                        .select('*', { count: 'exact', head: true })
                        .eq('status', 'pending')
                        .lt('id', myId);

                    document.getElementById('queueNumber').innerText = count ?? 0;
                    document.getElementById('msg').innerText = count === 0
                        ? 'أنت التالي مباشرة! استعد 💈'
                        : 'سنحدث الشاشة تلقائياً عند اقتراب دورك.';
                }
            } catch (e) {}
        }

        function showConfirm() { document.getElementById('confirmOverlay').classList.add('show'); }
        function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }

        async function confirmDone() {
            closeConfirm();
            try {
                await db.from('appointments').update({ status: 'completed' }).eq('id', myId);
                document.getElementById('queueDisplay').style.display = 'none';
                document.getElementById('finishScreen').style.display = 'block';
                myId = null;
            } catch (e) {
                alert('حدث خطأ: ' + e.message);
            }
        }
    </script>
</body>
</html>
